<!doctype html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  color:#172033;
  font:14px Arial,sans-serif
}

.app{padding:14px}

.eyebrow{
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
  color:#4053bc;
  margin-bottom:4px
}

.title{
  font-size:19px;
  font-weight:800;
  margin-bottom:8px
}

.hint{
  font-size:12px;
  color:#50627a;
  margin-bottom:12px
}

.card{
  background:#fff;
  border:1px solid #dfe5ef;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  box-shadow:0 1px 2px #00000008
}

.orderCard{
  border-left:4px solid #6b5ce7
}

.auditCard{
  border-left:4px solid #1877d2
}

.auditTop{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center
}

.auditTitle{
  font-size:14px;
  font-weight:800
}

.auditGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:8px
}

.auditMetric{
  background:#f7f9fd;
  border-radius:8px;
  padding:8px
}

.auditMetric span{
  display:block;
  color:#50627a;
  font-size:12px;
  text-transform:uppercase
}

.auditMetric b{
  display:block;
  font-size:15px;
  margin-top:2px
}

.auditGood{
  color:#087443
}

.auditWarn{
  color:#8a5100
}

.auditBad{
  color:#ad2b2b
}

.auditArea{
  background:#eef9f3;
  border-radius:8px;
  padding:8px;
  margin-top:8px;
  font-size:12px
}

.auditWarning{
  background:#fff5df;
  color:#805a00;
  border-radius:7px;
  padding:7px;
  margin-top:7px;
  font-size:12px
}

.missingList{
  margin-top:8px;
  border-top:1px solid #edf0f5;
  padding-top:6px
}

.missingItem{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:5px 0;
  font-size:12px;
  border-bottom:1px dashed #edf0f5
}

.orderTop{
  display:flex;
  justify-content:space-between;
  gap:7px;
  align-items:flex-start
}

.orderArt{
  font-size:17px;
  font-weight:800;
  margin:6px 0
}

.badge{
  font-size:12px;
  color:#996600;
  background:#fff1c9;
  border-radius:12px;
  padding:5px 7px;
  font-weight:bold
}

.badge.done{
  color:#087443;
  background:#dff8ea
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:8px
}

.metric{
  background:#f7f9fd;
  border-radius:7px;
  padding:7px
}

.metric label,.label{
  display:block;
  font-size:12px;
  color:#50627a;
  text-transform:uppercase;
  margin-bottom:3px
}

.metric b{font-size:12px}

.muted{
  color:#50627a;
  font-size:12px
}

.blue{
  color:#4053bc;
  font-size:12px;
  font-weight:bold
}

.section{
  font-size:14px;
  font-weight:800;
  margin:10px 0 7px
}

.row{
  display:flex;
  gap:6px;
  align-items:center
}

input{
  width:100%;
  height:30px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  padding:6px 8px;
  background:#fff
}

button{
  min-height:30px;
  border:0;
  border-radius:7px;
  background:#7558ee;
  color:#fff;
  padding:6px 10px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer
}

button.secondary{
  background:#edf1fb;
  color:#4d61ce
}

button.green{
  background:#22a06b
}

button.orange{
  background:#e88a16
}

button.danger{
  background:#d64545
}

button.blueButton{
  background:#1877d2
}

button.small{
  min-height:26px;
  padding:4px 8px;
  font-size:12px
}

button:disabled{
  opacity:.5;
  cursor:not-allowed
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:9px
}

.addBox{
  background:#f8f9fd;
  border:1px solid #e5e9f1;
  border-radius:9px;
  padding:9px;
  margin-top:10px
}

.roll{
  border-top:1px solid #eef1f6;
  padding:10px 0
}

.rollHead{
  display:flex;
  gap:6px;
  align-items:center
}

.rollHead input{
  font-weight:800
}

.rollMeta{
  margin:5px 0 7px
}

.detail{
  border-top:1px dashed #dfe5ef;
  padding:8px 0;
  display:grid;
  gap:6px
}

.numberEdit{
  display:flex;
  gap:5px;
  align-items:center
}

.numberEdit input{
  width:62px
}

.checks{
  display:flex;
  gap:10px
}

.check{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:12px;
  color:#56627b
}

.check input{
  width:15px;
  height:15px
}

.progressRow{
  margin:7px 0
}

.progressLabel{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:bold
}

.bar{
  height:6px;
  background:#e8edf5;
  border-radius:9px;
  overflow:hidden;
  margin-top:3px
}

.bar i{
  display:block;
  height:100%;
  background:#5775f6
}

.bar.green i{
  background:#26b77a
}

.allocation{
  margin-top:9px;
  background:#f7f9fd;
  border-radius:9px;
  padding:9px
}

.allocTop{
  display:flex;
  justify-content:space-between;
  gap:7px;
  font-size:12px;
  font-weight:bold
}

.allocGrid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
  margin-top:7px
}

.allocCell{
  background:#fff;
  border-radius:7px;
  padding:6px
}

.allocCell span{
  display:block;
  font-size:12px;
  color:#50627a;
  text-transform:uppercase
}

.kpi{
  background:#eef9f3;
  color:#14734d;
  border-radius:6px;
  padding:6px 7px;
  font-size:12px;
  font-weight:bold
}

.error{
  color:#ad2b2b;
  background:#fff0f0;
  padding:9px;
  border-radius:8px
}

.ok{
  color:#087443;
  background:#e8f8ef;
  padding:8px;
  border-radius:8px;
  margin-bottom:8px
}

.empty{
  text-align:center;
  color:#50627a;
  padding:12px
}

body{overflow-x:hidden}.app,.card,.metric,.auditMetric,.allocCell{min-width:0}
.metric b,.auditMetric b,.orderArt{overflow-wrap:anywhere}
.row{flex-wrap:wrap}.row button{flex:1}.rollHead input{min-width:0}.orderTop .blue{min-width:0;overflow-wrap:anywhere}
input,select,textarea{font:inherit;color:inherit;max-width:100%}
select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:6px 8px}
textarea{resize:vertical}.numberEdit input{min-width:0}
.auditDetails{font-size:12px;color:#50627a;margin-top:8px}.auditDetails summary{cursor:pointer}
.factBox{margin-top:10px}.factBox summary{font-size:12px;font-weight:800;cursor:pointer}
.factGrid{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:6px;margin:8px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #7558ee;outline-offset:2px}
.panelLinks{display:flex;gap:6px;margin:12px 0 0}.panelLinks button{flex:1}
#deleteRollDialog{width:min(calc(100% - 24px),320px);max-width:320px;max-height:calc(100vh - 24px);overflow:auto;border:1px solid #dfe5ef;border-radius:12px;padding:14px;color:#172033;box-shadow:0 12px 36px #00000030}
#deleteRollDialog::backdrop{background:#17203380}
.deleteDialogTitle{font-size:15px;font-weight:800;margin:0 0 8px}
.deleteDialogCopy{font-size:12px;line-height:1.45;color:#56627b;margin:0}
.deleteDialogError{font-size:12px;color:#ad2b2b;margin-top:8px}
.deleteDialogError:empty{display:none}
.deleteDialogActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}
.rollDeleteButton{width:100%;margin-top:2px}

<body>
<div class="app">
  <header class="workspaceHeader"><div class="workspaceBrand"><b>RITM /</b> Рулоны</div><button class="secondary" id="refreshSelection" aria-label="Обновить выделение">Обновить</button></header>
  <div id="message" role="status" aria-live="polite"></div>
  <div id="orders"><div class="card muted">Загружаю выбранные строки…</div></div>
  <details id="auditDisclosure" class="workspaceAudit"><summary>Проверка KPI</summary><div id="kpiAudit"><button id="checkKpi" class="secondary">Проверить</button></div></details>
  <div class="panelLinks"><button class="secondary small" id="openJournal">Журнал выпуска</button><button class="secondary small" id="openDaily">Выпуск по дням</button></div>
</div>
<dialog id="deleteRollDialog" aria-labelledby="deleteRollTitle" aria-describedby="deleteRollCopy">
  <h2 class="deleteDialogTitle" id="deleteRollTitle">Удалить рулон?</h2>
  <p class="deleteDialogCopy" id="deleteRollCopy"></p>
  <div class="deleteDialogError" id="deleteRollError" role="alert" aria-live="assertive"></div>
  <div class="deleteDialogActions">
    <button class="secondary" id="cancelDeleteRoll" type="button">Оставить рулон</button>
    <button class="danger" id="confirmDeleteRoll" type="button">Удалить рулон</button>
  </div>
</dialog>
<dialog id="editRollDialog" class="editRollDialog" aria-labelledby="editRollTitle">
  <h2 class="deleteDialogTitle" id="editRollTitle">Изменить рулон</h2>
  <p class="deleteDialogCopy" id="editRollArticle"></p>
  <label>Название рулона<input id="editRollName" autocomplete="off" aria-label="Название рулона"></label>
  <label>Количество, шт.<input id="editRollQuantity" type="number" min="1" step="1" aria-label="Количество штук на рулоне"></label>
  <p class="workHelp" id="editRollHelp"></p>
  <p class="workHelp" id="editRollAllocation"></p>
  <div class="deleteDialogError" id="editRollError" role="alert" aria-live="assertive"></div>
  <div class="deleteDialogActions"><button class="secondary" id="cancelEditRoll" type="button">Закрыть</button><button id="saveEditRoll" type="button">Сохранить</button></div>
</dialog>
<script>
var panelVersion='2026-11-14.1';
var state={orders:[],signature:'',revision:''}, busy=false, pollBusy=false, auditBusy=false, auditQueued=false, loadVersion=0, deleteContext=null, deleteInFlight=false, editContext=null, editPending=null;
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(value,digits){return Number(value||0).toLocaleString('ru-RU',{maximumFractionDigits:digits==null?0:digits});}
function node(tag,cls,text){var el=document.createElement(tag);if(cls)el.className=cls;if(text!=null)el.textContent=text;return el;}
function msg(text,ok){var host=document.getElementById('message');host.innerHTML=text?'<div class="'+(ok?'ok':'error')+'">'+esc(text)+'</div>':'';}
function setBusy(value){busy=!!value;if(busy)loadVersion++;document.querySelectorAll('button').forEach(function(b){b.disabled=busy||b.dataset.locked==='true'||b.id==='checkKpi'&&auditBusy;});document.querySelectorAll('.workForm input,.workForm textarea,.workspaceCreate input,.workspaceArticleChoice input,.workspaceSelectAll input,.workspaceRoll input').forEach(function(field){field.disabled=busy||!!workspace.pending||!!state.preview;});}
// Only idempotent reads may retry Google's transient RPC INTERNAL errors.
function panelRead(method,args,success,failure){
  if(['r2PanelData','r2PanelRefreshData','r2PanelPoll','r2PanelKpiAudit'].indexOf(method)<0)throw Error('Нельзя автоматически повторять запись.');
  var attempt=0,version=loadVersion;
  function send(){
    function failed(error){
      var text=error&&error.message?error.message:String(error);
      if(attempt<2&&version===loadVersion&&(!error||error.retryable!==false)&&/INTERNAL|ошибка сервера|server error|timed? ?out|temporar|unavailable|временно не ответил/i.test(text)){
        attempt++;setTimeout(function(){if(version===loadVersion)send();else failure('Чтение отменено: выполняется другая операция.');},attempt*1200);return;
      }
      failure(text);
    }
    var runner=google.script.run.withSuccessHandler(function(result){
      if(result&&result.readError){failed(result);return;}
      success(result);
    }).withFailureHandler(failed);runner[method].apply(runner,args||[]);
  }
  send();
}
function server(method,args,success,failure){
  setBusy(true);
  var done=function(result){setBusy(false);success(result);},failed=function(text){setBusy(false);if(failure)failure(text);else msg(text,false);};
  if(method==='r2PanelData'||method==='r2PanelRefreshData')panelRead(method,args,done,failed);
  else{var runner=google.script.run.withSuccessHandler(done).withFailureHandler(function(error){failed(error&&error.message?error.message:String(error));});runner[method].apply(runner,args||[]);}
}
function button(text,cls,fn,locked){var b=node('button',cls,text);b.type='button';b.dataset.locked=String(!!locked);b.disabled=busy||!!locked;b.addEventListener('click',fn);return b;}
function action(method,args,message){server(method,args,function(result){msg(result&&result.message||message||'Сохранено.',true);pollSelection();refreshAuditWhenIdle();});}
function addRollsAction(o,add){
  if(deleteInFlight){msg('Сначала дождитесь удаления рулона. Панель и выбор вкладки остаются доступны.',false);return;}
  var nameInput=add.querySelector('.newName'),piecesInput=add.querySelector('.newPieces'),countInput=add.querySelector('.newCount');
  var name=nameInput.value.trim(),quantity=Number(piecesInput.value),countText=String(countInput.value||'').trim();
  var count=countText?Number(countText):1;
  if(!name){msg('Введите название рулона, например д17.',false);nameInput.focus();return;}
  if(!Number.isInteger(quantity)||quantity<1){msg('Укажите целое количество штук на каждом рулоне.',false);piecesInput.focus();return;}
  if(!countText)countInput.value='1';
  if(!Number.isInteger(count)||count<1||count>500){msg('Укажите количество рулонов от 1 до 500.',false);countInput.focus();return;}
  var args=orderArgs(o).concat([name,quantity,count]);
  server('r2PanelAddRolls',args,function(result){
    msg(result&&result.message||'Рулоны добавлены.',true);
    if(!result||!result.order)return;
    if(result.signature!==state.signature){pollSelection();return;}
    var replaced=false;
    var orders=(state.orders||[]).map(function(current){
      if(current.uid===result.order.uid&&current.sheetName===result.order.sheetName&&current.row===result.order.row){replaced=true;return result.order;}
      return current;
    });
    if(replaced)drawOrders({orders:orders,signature:state.signature,revision:result.revision});
  });
}

function focusAfterRollDelete(groupName){
  var groups=Array.prototype.slice.call(document.querySelectorAll('#orders .roll'));
  var sameGroup=groups.find(function(group){return group.dataset.rollGroup===groupName;});
  var target=sameGroup&&sameGroup.querySelector('.row button');
  if(!target&&groups.length)target=groups[0].querySelector('.row button');
  if(!target)target=document.querySelector('#orders .addBox .newName');
  if(target)target.focus();
}

function markRollDeleteButton(rollId,mode){
  Array.prototype.forEach.call(document.querySelectorAll('.rollDeleteButton'),function(button){
    if(button.dataset.rollId!==rollId)return;
    if(mode==='deleting'){button.disabled=true;button.textContent='Удаляем…';}
    else if(mode==='deleted'){button.disabled=true;button.textContent='Удалён';}
    else{button.disabled=busy||button.dataset.locked==='true';button.textContent='Удалить рулон';}
  });

document.getElementById('confirmDeleteRoll').addEventListener('click',function(){
  if(!deleteContext||busy||deleteInFlight)return;
  var context=deleteContext,dialog=document.getElementById('deleteRollDialog'),rollId=context.roll.rollId;
  document.getElementById('deleteRollError').textContent='';
  if(dialog.open)dialog.close();

  msg('Удаляем рулон «'+context.roll.name+'» №'+num(context.roll.number)+'… Можно переключать вкладки.',true);

  }).r2PanelDeleteRoll(rollId,context.order.sheetName,context.order.row);

    html+='</details>';

function refreshAudit(){

  function finish(a){auditBusy=false;drawAudit(a);if(auditQueued){auditQueued=false;refreshAudit();}}
  panelRead('r2PanelKpiAudit',[],finish,function(error){finish({error:error});});
}

function panelFieldFocused(){
  var active=document.activeElement;
  var panelFocused=!document.hasFocus||document.hasFocus();
  return panelFocused&&active&&!active.readOnly&&!active.disabled&&/^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName);
}
function pollSelection(){
  if(busy||pollBusy||auditBusy||document.hidden||panelFieldFocused()||Date.now()<(state.nextPollAt||0))return;
  pollBusy=true;var version=loadVersion;
  panelRead('r2PanelPoll',[state.signature,state.revision,!!state.preview||!state.orders||!state.orders.length,panelVersion,!workspace.pending],function(next){
    pollBusy=false;
    if(version!==loadVersion)return;
    var recovered=!!state.pollFailures;
    if(recovered){state.pollFailures=0;state.nextPollAt=0;state.lastReadFailed=false;state.lastPollErrorMessage='';msg('',false);}
    if(next&&next.changed&&!busy&&version===loadVersion&&!panelFieldFocused()){
      msg('',false);drawOrders(next);
      if(next.preview)hydrateSelection(version);
    }
    if(recovered&&typeof refreshAuditWhenIdle==='function')setTimeout(refreshAuditWhenIdle,0);
  },function(text){
    pollBusy=false;if(version!==loadVersion)return;
    // Keep one stable notice and back off instead of piling up Apps Script calls.

    var fields=[];if(workspace.createMode==='individual')fields.push(['Название рулона','name','Например, а12']);fields.push(['Штук на рулоне','quantity','План '+num(order.orderQty)],['Количество рулонов','count','1']);
    fields.forEach(function(field){var label=node('label','fieldLabel',field[0]),input=node('input','');input.setAttribute('aria-label',field[0]+' '+order.article);input.value=draft[field[1]];input.placeholder=field[2];input.disabled=!!workspace.pending;if(field[1]!=='name'){input.type='number';input.min='1';input.step='1';}input.addEventListener('input',function(){draft[field[1]]=input.value;update();});label.appendChild(input);row.appendChild(label);});rowHost.appendChild(row);
  });
  var warning=node('div','workHelp'),error=node('div','workError');error.setAttribute('role','alert');section.appendChild(warning);section.appendChild(error);
  var save=button('Создать рулоны','workSubmit',workspaceCreate,!!workspace.pending);section.appendChild(save);host.appendChild(section);
  function update(){var count=0,pieces=0,invalid='',over=[];orders.forEach(function(order){var draft=workspace.createDrafts[workspaceKey(order)],name=workspace.createMode==='shared'?workspace.sharedName:draft.name,q=draft.quantity.trim()===''?Number(order.orderQty):Number(draft.quantity),n=draft.count.trim()===''?1:Number(draft.count);
      if(!/^[дап]/i.test(name.trim()))invalid='Введите название с д, а или п для каждого рулона.';
      if(!Number.isInteger(q)||q<1||!Number.isInteger(n)||n<1)invalid='Количество штук и рулонов должно быть целым и больше нуля.';
      count+=n;pieces+=q*n;if(q*n+Number(order.allocated)>order.orderQty)over.push(order.article);
    });if(count>500)invalid='За один запрос — до 500 рулонов.';
    warning.textContent=over.length?'Распределение превысит план: '+over.slice(0,5).join(', ')+(over.length>5?' и ещё '+num(over.length-5):'')+'. Новые рулоны добавятся к существующим.':'';error.textContent=invalid;
    save.textContent='Создать '+num(count)+' рул. · '+num(pieces)+' шт.';save.dataset.locked=String(!!invalid||!!workspace.pending);save.disabled=busy||save.dataset.locked==='true';
  }update();
}
function workspaceCreate(){
  if(busy||deleteInFlight)return;
  if(!workspace.pending){var orders=state.orders.filter(function(o){return workspace.articleSelected[workspaceKey(o)];});if(!orders.length)return;
    workspace.pending={kind:'create',requestId:'RA'+Date.now().toString(36)+Math.random().toString(36).slice(2,12),items:orders.map(function(o){var draft=workspace.createDrafts[workspaceKey(o)];return {uid:o.uid,sheetName:o.sheetName,row:o.row,article:o.article,name:workspace.createMode==='shared'?workspace.sharedName:draft.name,quantity:draft.quantity.trim()===''?null:Number(draft.quantity),count:draft.count.trim()===''?1:Number(draft.count),expectedPlan:Number(o.orderQty),expectedAllocated:Number(o.allocated)};})};workspaceStorage(workspace.pending);
  }
  var submitted=workspace.pending;if(submitted.kind!=='create')return;msg('Создаём рулоны…',true);
  server('r2WorkspaceCreate',[submitted],function(result){
    if(!result||result.requestId!==submitted.requestId){msg('Ответ не подтверждён. Продолжите создание того же запроса.',false);workspaceRender();return;}
    if(result.rejected){workspace.pending=null;workspaceStorage(null);msg(result.message+' Рулоны не созданы.',false);load(true);return;}
    workspace.pending=null;workspaceStorage(null);workspace.dirty=false;workspace.createDrafts={};workspace.createOpen=false;workspace.articleSelected={};workspace.selected={};
    var updates=result.orders||[];drawOrders({orders:state.orders.map(function(o){return updates.find(function(n){return workspaceKey(n)===workspaceKey(o);})||o;}),signature:state.signature,revision:state.revision,workbookId:workspace.bookId});msg(result.message,true);
  },function(error){workspace.pending.resume=true;workspaceStorage(workspace.pending);msg('Создание не подтверждено: '+error+' Продолжите тот же запрос — копии не добавятся.',false);workspaceRender();});
}
function workspaceDraft(entry){return workspace.quantities[workspace.operation+'|'+entry.roll.rollId]||'';}
function workspaceAmount(entry){var draft=workspaceDraft(entry);return draft.trim()===''?workspaceRemaining(entry.roll):Number(draft);}
function workspaceRenderWork(host){
  var entries=workspaceEntries().filter(function(e){return workspace.selected[e.roll.rollId];});
  var form=node('section','workForm');form.setAttribute('aria-label','Запись работы');form.appendChild(node('h2','',workspace.mode==='bulk'?'Действие для выбранных':entries.length?'Рулон '+entries[0].roll.name:'Запись работы'));
  var tabs=node('div','workspaceTabs');[['Печать','Печать'],['Порезка','Резка']].forEach(function(pair){var b=button(pair[0],'',function(){workspace.operation=pair[1];workspace.dirty=true;workspaceRender();},!!workspace.pending);b.setAttribute('aria-pressed',workspace.operation===pair[1]);tabs.appendChild(b);});form.appendChild(tabs);
  var employeeLabel=node('label','fieldLabel','Сотрудник'),employee=node('input','workEmployee');employee.readOnly=true;employee.setAttribute('aria-label','Сотрудник для записи');
  var employees={};entries.forEach(function(e){employees[e.roll.employee||'По имени рулона']=true;});employee.value=workspace.operation==='Резка'?(entries.length?entries[0].order.cutter||'Лукман':'Лукман'):Object.keys(employees).length===1?Object.keys(employees)[0]:'По имени каждого рулона';employeeLabel.appendChild(employee);form.appendChild(employeeLabel);
  if(workspace.mode==='single'&&entries.length){var label=node('label','fieldLabel','Количество, шт.');form.appendChild(label);var quantity=node('input','');quantity.type='number';quantity.min='1';quantity.step='1';quantity.placeholder='Пусто — весь остаток';quantity.value=workspaceDraft(entries[0]);quantity.setAttribute('aria-label','Количество для выбранного рулона');quantity.disabled=!!workspace.pending;
    var quantityRow=node('div','quantityRow');quantityRow.appendChild(quantity);quantityRow.appendChild(button('Весь остаток','',function(){quantity.value='';workspace.quantities[workspace.operation+'|'+entries[0].roll.rollId]='';update();},!!workspace.pending));form.appendChild(quantityRow);
    quantity.addEventListener('input',function(){workspace.quantities[workspace.operation+'|'+entries[0].roll.rollId]=quantity.value;workspace.dirty=true;update();});
  }
  if(workspace.mode==='bulk'){
    var quantities=node('details','');quantities.appendChild(node('summary','','Количество по рулонам'));
    entries.forEach(function(entry){var row=node('div','workspaceBulkInput'),label=node('label','','');label.appendChild(node('b','',entry.order.article+' · '+entry.roll.name));label.appendChild(document.createTextNode('Осталось '+num(workspaceRemaining(entry.roll))+' шт.'));
      var input=node('input','');input.type='number';input.min='1';input.step='1';input.placeholder='Пусто — весь остаток';input.setAttribute('aria-label','Количество '+entry.order.article+' '+entry.roll.name);input.value=workspaceDraft(entry);input.disabled=!!workspace.pending;
      input.addEventListener('input',function(){workspace.quantities[workspace.operation+'|'+entry.roll.rollId]=input.value;workspace.dirty=true;update();});label.appendChild(input);row.appendChild(label);quantities.appendChild(row);
    });form.appendChild(quantities);
  }
  var total=node('div','workTotal'+(workspace.mode==='single'?' singleTotal':''));form.appendChild(total);var help=node('div','workHelp',workspace.mode==='bulk'?'Пустое количество — весь остаток каждого выбранного рулона.':'Пусто — весь остаток выбранного рулона.');form.appendChild(help);
  var error=node('div','workError');error.setAttribute('role','alert');form.appendChild(error);
  var comment=node('details','');comment.appendChild(node('summary','','Комментарий'));var textarea=node('textarea','');textarea.maxLength=2000;textarea.setAttribute('aria-label','Комментарий к работе');textarea.value=workspace.comment;textarea.disabled=!!workspace.pending;textarea.addEventListener('input',function(){workspace.comment=textarea.value;workspace.dirty=true;textarea.style.height='auto';textarea.style.height=textarea.scrollHeight+'px';});comment.appendChild(textarea);form.appendChild(comment);
  var save=button('Записать работу','workSubmit',function(){workspaceSave(entries);});var dock=node('div','workspaceSubmitDock');if(workspace.mode==='bulk')dock.appendChild(total);dock.appendChild(save);form.appendChild(dock);host.appendChild(form);
  function update(){var sum=0,invalid='';entries.forEach(function(entry){var amount=workspaceAmount(entry);if(workspaceReady(entry.roll))return;sum+=Number.isFinite(amount)?amount:0;if(!Number.isInteger(amount)||amount<0||amount>workspaceRemaining(entry.roll)||(workspaceDraft(entry).trim()!==''&&amount===0))invalid='Количество должно быть целым и не превышать остаток.';});
    var actionable=entries.filter(function(e){return !workspaceReady(e.roll);});
    total.textContent='К записи: '+num(actionable.length)+' рул. · '+num(sum)+' шт.'+(entries.length>actionable.length?' · Уже готовы: '+num(entries.length-actionable.length):'');error.textContent=invalid||(!entries.length?'Выберите рулоны.':!actionable.length?'Этот этап по выбранным рулонам уже завершён.':'');
    save.textContent=workspace.pending?'Продолжить сохранение':(workspace.operation==='Печать'?'Записать печать':'Записать порезку')+(sum>0?' · '+num(sum)+' шт.':'');save.dataset.locked=String(!workspace.pending&&(!entries.length||!!invalid||!actionable.length));save.disabled=busy||save.dataset.locked==='true';
  }update();
}
function workspaceSave(entries){
  if(busy||deleteInFlight)return;
  if(!workspace.pending){var items=entries.filter(function(e){return !workspaceReady(e.roll);}).map(function(e){return {rollId:e.roll.rollId,article:e.order.article,uid:e.order.uid,sheetName:e.order.sheetName,row:e.order.row,quantity:workspaceDraft(e).trim()===''?null:Number(workspaceDraft(e)),expectedActual:workspaceActual(e.roll),expectedQuantity:Number(e.roll.quantity)};});
    if(!items.length)return;workspace.pending={requestId:'RW'+Date.now().toString(36)+Math.random().toString(36).slice(2,12),operation:workspace.operation,items:items,comment:workspace.comment};workspaceStorage(workspace.pending);
  }
  var submitted=workspace.pending;msg('Сохраняем работу…',true);
  server('r2WorkspaceSave',[submitted],function(result){
    if(!result||result.requestId!==submitted.requestId){msg('Ответ не подтверждён. Продолжите сохранение того же запроса.',false);workspaceRender();return;}
    if(result.rejected){workspace.pending=null;workspaceStorage(null);msg(result.message+' Работа не записана. Обновляем данные.',false);load(true);return;}
    workspace.pending=null;workspaceStorage(null);workspace.dirty=false;workspace.quantities={};workspace.comment='';
    var updates=result.orders||[];var orders=(state.orders||[]).map(function(o){return updates.find(function(next){return workspaceKey(next)===workspaceKey(o);})||o;});
    drawOrders({orders:orders,signature:state.signature,revision:state.revision,workbookId:workspace.bookId});msg(result.message||'Работа сохранена.',true);refreshAuditWhenIdle();
  },function(error){workspace.pending.resume=true;workspaceStorage(workspace.pending);msg('Сохранение не подтверждено: '+error+' Продолжите тот же запрос; новая копия записи не создаётся.',false);workspaceRender();});
}
document.getElementById('auditDisclosure').addEventListener('toggle',function(){if(this.open)refreshAuditWhenIdle();});
document.getElementById('checkKpi').addEventListener('click',refreshAudit);
load(false);setInterval(pollSelection,1200);
</script>
