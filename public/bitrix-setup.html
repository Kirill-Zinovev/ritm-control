<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подключение бота · RITM</title><style>
body{font:16px system-ui,sans-serif;background:#edf4fb;color:#142844;margin:0;padding:32px}main{max-width:620px;margin:auto;background:white;border:1px solid #dae5f2;border-radius:18px;padding:28px}label{display:block;font-weight:650;margin:20px 0 8px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bfcfe1;border-radius:8px;font:inherit}button{margin:22px 8px 0 0;padding:12px 16px;background:#255ee9;color:white;border:0;border-radius:8px;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.55}p{line-height:1.5;color:#516582}#status{min-height:1.5em}img{width:88px;height:88px;border-radius:50%;object-fit:cover;float:right}small{color:#516582}
</style></head><body><main><img src="/ritm-chameleon.png" alt="Хамелеон — аватар бота"><h1>Бот RITM</h1><p>Подключение к чатам бокса и рулонной печати. Настраивать его может только владелец RITM.</p><form id="form" autocomplete="off"><label for="hook">Адрес подключения Битрикс24</label><input id="hook" type="password" required autocomplete="off"><label for="client">Код бота CLIENT_ID</label><input id="client" type="password" required autocomplete="off"><small>Данные хранятся в зашифрованном виде и не показываются другим пользователям.</small><div><button id="save" type="submit">Подключить</button><button type="button" id="avatar">Установить аватар</button><button type="button" id="test">Проверить связь</button></div><p id="status" role="status" aria-live="polite"></p></form></main><script>
const status=document.getElementById('status'),form=document.getElementById('form'),save=document.getElementById('save'),avatar=document.getElementById('avatar'),test=document.getElementById('test');
async function send(path,payload){const response=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.message||'Не удалось выполнить действие.');return data}
form.addEventListener('submit',async event=>{event.preventDefault();save.disabled=true;status.textContent='Подключаем…';try{await send('/api/bitrix-setup',{webhook:document.getElementById('hook').value,clientId:document.getElementById('client').value});form.reset();status.textContent='Подключение сохранено.'}catch(error){status.textContent=error.message}finally{save.disabled=false}});
avatar.addEventListener('click',async()=>{avatar.disabled=true;status.textContent='Устанавливаем аватар…';try{const r=await send('/api/bitrix-setup/avatar',{});status.textContent=r.confirmed?'Аватар установлен.':'Битрикс24 принял запрос, но изображение ещё не подтверждено.'}catch(error){status.textContent=error.message}finally{avatar.disabled=false}});
test.addEventListener('click',async()=>{test.disabled=true;status.textContent='Проверяем связь…';try{const r=await send('/api/bitrix-setup/test',{});status.textContent=r.results.shared==='sent'?'Тестовое сообщение отправлено в общий чат.':'Доставка не подтверждена. Проверьте чат перед повторной отправкой.'}catch(error){status.textContent=error.message}finally{test.disabled=false}});
const greeting=document.createElement('button');greeting.type='button';greeting.textContent='Отправить приветствие';test.parentElement.append(greeting);greeting.addEventListener('click',async()=>{greeting.disabled=true;status.textContent='Отправляем приветствие…';try{const r=await send('/api/bitrix-setup/greeting',{});status.textContent=r.status==='sent'?'Приветствие отправлено.':'Результат отправки не подтверждён. Проверьте чат; повторная отправка заблокирована.'}catch(error){status.textContent=error.message}finally{greeting.disabled=false}});
</script></body></html>
